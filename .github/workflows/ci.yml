name: Windows and macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PAPERPAL_TEST_SOFTWARE_GL: ${{ matrix.os == 'macos-15-intel' && '1' || '0' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: macOS window metadata bridge
        if: runner.os == 'macOS'
        run: /usr/bin/osascript -l JavaScript platform/macos-host.js --self-check
      - run: npm run test:desktop
      - run: npm run test:setup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: docs/*validation*.json
  source:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run package:source
      - uses: actions/upload-artifact@v7
        with:
          name: paperpal-source
          path: dist/
