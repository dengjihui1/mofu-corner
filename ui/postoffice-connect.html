<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'"><title>绒角 · 连接小邮局</title><link rel="stylesheet" href="postoffice.css"><script type="module" src="postoffice-connect.mjs"></script></head><body><header class="post-header"><div class="brand"><h1>绒角 <span>小邮局</span></h1></div></header><main class="auth-main"><div class="auth-art"><div id="postman-art" class="postman-art"></div><p class="auth-hello">把小心意，<br>寄给朋友。</p></div><section class="auth-panel"><h2>连接小邮局</h2><form id="connect-form"><label for="postoffice-url">邮局地址</label><input id="postoffice-url" type="url" placeholder="https://你的邮局域名" required autocomplete="url"><p id="connect-error" class="form-message" role="status" hidden></p><button id="connect-submit" class="primary" type="submit">进入邮局</button></form></section></main></body></html>
