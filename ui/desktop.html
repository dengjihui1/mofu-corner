</head><body class="desktop-nest"><svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="desktop-alpha-clean" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA type="table" tableValues="0 0 .35 .7 1 1"/></feComponentTransfer></filter></defs></svg>
<header class="app-header"><a class="brand" href="/">绒角 <span>MofuCorner</span></a><span class="header-label">十二生肖陪伴小剧场</span><nav><button id="motion-toggle" type="button" aria-pressed="true">小动作已开启</button><a href="/">回到桌宠小屋</a></nav></header>
<main><div class="page-intro"><div><p class="intro-kicker">有一点脾气，也有很多可爱。</p><h1>今天，和谁待一会儿？</h1></div><p>摸摸它，陪它玩，或者一起放空。<br>每一个小伙伴，都会用自己的方式回应你。</p></div>
<div class="experience">
<aside class="friends"><div class="friends-title"><h2>小伙伴们</h2><span>十二只，都不一样</span></div><div id="cast" class="cast" role="group" aria-label="选择生肖小伙伴"></div><p class="picker-hint">用方向键，也可以换一位朋友。</p></aside>
<section class="theater" aria-label="角色互动舞台"><div class="theater-top"><span id="scene-title"></span><span class="state-badge" id="state-badge">自在陪伴</span></div>
<div class="stage" id="stage"><div class="stage-orbit" aria-hidden="true"></div><div class="speech" id="speech" role="status" aria-live="polite" aria-atomic="true"></div><div class="pet-anchor"><div class="pet-aim" id="pet-aim"><button id="pet" class="pet" type="button"><span id="portrait" class="portrait"></span></button></div></div><div class="pet-shadow" aria-hidden="true"></div><div id="effects" class="effects" aria-hidden="true"></div><div class="sleep-mark" aria-hidden="true">z z</div><p class="touch-hint" id="touch-hint"></p></div>
<div class="mobile-actions" aria-label="快速互动"><button type="button" data-quick="touch">摸摸</button><button type="button" data-quick="play">陪它玩</button><button type="button" data-quick="rest">休息</button></div><div class="play-tray" id="play-tray"></div></section>
<aside class="companion-panel"><span class="species" id="species"></span><h2 id="name"></h2><p class="trait" id="trait"></p><p class="personality" id="personality"></p><div class="actions" aria-label="和小伙伴互动"><button id="touch-action" type="button" class="primary"></button><button id="play-action" type="button"></button><button id="rest-action" type="button"></button></div><div class="memory"><div><span class="memory-icon" aria-hidden="true"></span><b>它记得的小事</b></div><p id="memory-text"></p><span class="memory-count" id="memory-count"></span></div><button id="details-toggle" class="details-toggle" type="button" aria-expanded="false" aria-controls="design-details">看看它的模样与配色 <span aria-hidden="true">＋</span></button><div id="design-details" hidden><p id="shape"></p><div id="palette" class="palette"></div></div></aside>
</div><footer><p>十二生肖已接入桌面小窝，支持选择、连续动作与本机保存。</p><a href="assets/zodiac-lineup-v1.png" download="paperpal-zodiac-lineup-v1.png">收藏全员形象</a></footer>
</main><button id="nest-toggle" type="button" aria-expanded="false" aria-controls="nest-sheet"><span>小窝</span><b aria-hidden="true">⌑</b></button><span id="drag-tag">拖动搬家</span><section id="nest-sheet" hidden><div class="nest-cover"><span class="nest-mark">绒角</span><div><small>随身小窝</small><h2>把陪伴，装进口袋。</h2></div><button id="nest-close" aria-label="收起小窝" type="button">×</button><span class="nest-stamp" id="nest-stamp">龙</span></div><nav class="nest-tabs" aria-label="小窝抽屉"><button data-drawer="friends" type="button" aria-selected="true">换个伙伴</button><button data-drawer="toys" type="button" aria-selected="false">玩具抽屉</button><button data-drawer="settings" type="button" aria-selected="false">陪伴设置</button></nav><div id="nest-body"><section id="drawer-friends"></section><section id="drawer-toys" hidden></section><section id="drawer-settings" hidden><form id="native-settings"><label>小名<input id="native-name" maxlength="16" required></label><label>身量 <output id="native-size-label">60%</output><input id="native-size" type="range" min="55" max="130" value="60"></label><label>相处节奏<select id="native-personality"><option value="gentle">温柔陪伴</option><option value="playful">有一点淘气</option><option value="quiet">安静守候</option></select></label><div class="work-tabs" aria-label="办公模式"><button data-work="available" type="button">陪伴</button><button data-work="focus" type="button">专注25分</button><button data-work="meeting" type="button">会议</button><button data-work="rest" type="button">休息</button></div><button id="native-follow" type="button">跟随飞书 / Lark</button><p id="native-status" role="status"></p><button id="native-save" type="submit">收好这份设置</button></form></section></div><div class="nest-foot"><span id="native-saved">只在这台电脑，慢慢熟悉。</span><button id="native-classic" type="button">邮差小獭</button></div></section></body></html>
