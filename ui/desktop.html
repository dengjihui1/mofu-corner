<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>绒角 · 随身小窝</title><link rel="stylesheet" href="zodiac.css?v=2"><link rel="stylesheet" href="desktop-nest.css?v=30"><script type="module" src="desktop-nest.mjs?v=30"></script>
</head><body class="desktop-nest"><svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="desktop-alpha-clean" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA type="table" tableValues="0 0 .35 .7 1 1"/></feComponentTransfer></filter></defs></svg>
<button id="motion-toggle" type="button" aria-pressed="true" hidden>小动作已开启</button>
<main><div class="experience">
<aside class="friends"><div class="friends-title"><h2>小伙伴们</h2><span>十二只，都不一样</span></div><div id="cast" class="cast" role="group" aria-label="选择生肖小伙伴"></div><p class="picker-hint">用方向键，也可以换一位朋友。</p></aside>
<section class="theater" aria-label="角色互动舞台"><div class="theater-top"><span id="scene-title"></span><span class="state-badge" id="state-badge">自在陪伴</span></div>
<div class="stage" id="stage"><div class="stage-orbit" aria-hidden="true"></div><div class="speech" id="speech" role="status" aria-live="polite" aria-atomic="true"></div><div class="pet-anchor"><div class="pet-aim" id="pet-aim"><button id="pet" class="pet" type="button"><span id="portrait" class="portrait"></span></button></div></div><div class="pet-shadow" aria-hidden="true"></div><div id="effects" class="effects" aria-hidden="true"></div><div class="sleep-mark" aria-hidden="true">z z</div><p class="touch-hint" id="touch-hint"></p></div>
<div class="mobile-actions" aria-label="快速互动"><button type="button" data-quick="touch">摸摸</button><button type="button" data-quick="play">陪它玩</button><button type="button" data-quick="rest">休息</button></div><div class="play-tray" id="play-tray"></div></section>
<aside class="companion-panel"><span class="species" id="species"></span><h2 id="name"></h2><p class="trait" id="trait"></p><p class="personality" id="personality"></p><div class="actions" aria-label="和小伙伴互动"><button id="touch-action" type="button" class="primary"></button><button id="play-action" type="button"></button><button id="rest-action" type="button"></button></div><div class="memory"><div><span class="memory-icon" aria-hidden="true"></span><b>它记得的小事</b></div><p id="memory-text"></p><span class="memory-count" id="memory-count"></span></div><button id="details-toggle" class="details-toggle" type="button" aria-expanded="false" aria-controls="design-details">看看它的模样与配色 <span aria-hidden="true">＋</span></button><div id="design-details" hidden><p id="shape"></p><div id="palette" class="palette"></div></div></aside>
</div>
</main><button id="nest-toggle" type="button" aria-expanded="false" aria-controls="nest-sheet"><span>小窝</span><b aria-hidden="true">⌑</b></button><span id="drag-tag">拖动搬家</span><section id="nest-sheet" hidden aria-label="宠物小窝">
  <div class="nest-cover">
    <div class="nest-heading"><p class="nest-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nest-paw"/></svg>绒角 <span>陪伴小屋</span></p><h1 id="nest-title">小米的小窝</h1><p id="nest-greeting" aria-live="polite"></p></div>
    <button id="nest-close" aria-label="收起小窝" type="button"><span>收起</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
    <button id="nest-baby" class="nest-baby" type="button" aria-label="摸摸小伙伴"><span class="baby-mat"></span><span id="baby-portrait" class="baby-portrait" aria-hidden="true"></span><span class="baby-heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20S3 14 3 8.5C3 3 10 2 12 7c2-5 9-4 9 1.5C21 14 12 20 12 20Z"/></svg></span></button>
    <span id="nest-stamp" hidden></span>
  </div>
  <nav class="nest-tabs" aria-label="小窝抽屉">
    <button data-drawer="friends" type="button" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nest-paw"/></svg>小伙伴</button>
    <button data-drawer="toys" type="button" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M7 6c6 2 4 10 11 12M6 18c2-6 10-4 12-11"/></svg>一起玩</button>
    <button data-drawer="settings" type="button" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16"/><path d="M3 8h4M10 16h4M17 10h4" stroke-width="4"/></svg>照顾它</button>
  </nav>
  <div id="nest-body">
    <section id="drawer-friends"></section><section id="drawer-toys" hidden></section>
    <section id="drawer-settings" hidden>
      <form id="native-settings">
        <div class="name-row"><label for="native-name">它的小名</label><input id="native-name" maxlength="16" required autocomplete="off"></div>
        <div class="size-setting"><div class="setting-heading"><label for="native-size">小小身量</label><output id="native-size-label" for="native-size">60%</output></div><div class="size-track"><svg class="size-paw small" viewBox="0 0 24 24" aria-hidden="true"><use href="#nest-paw"/></svg><input id="native-size" type="range" min="55" max="130" value="60"><svg class="size-paw" viewBox="0 0 24 24" aria-hidden="true"><use href="#nest-paw"/></svg></div></div>
        <fieldset class="temper-setting"><legend>它的小性格</legend><select id="native-personality" aria-label="它的小性格" hidden><option value="gentle">温柔陪伴</option><option value="playful">有一点淘气</option><option value="quiet">安静守候</option></select><div class="personality-options"><button type="button" data-personality="gentle" aria-pressed="true">软乎乎</button><button type="button" data-personality="playful" aria-pressed="false">小淘气</button><button type="button" data-personality="quiet" aria-pressed="false">乖乖待着</button></div></fieldset>
        <fieldset class="mode-setting"><legend>今天怎么陪你</legend><div class="work-tabs" aria-label="办公模式"><button data-work="available" type="button">陪着我</button><button data-work="focus" type="button">专注 25 分</button><button data-work="meeting" type="button">开会中</button><button data-work="rest" type="button">歇一会</button></div></fieldset>
        <div class="follow-setting"><span><b>跟着飞书 / Lark</b><small id="native-status" role="status"></small></span><button id="native-follow" type="button" aria-pressed="false" aria-label="跟随飞书 / Lark · 未开启"><span class="switch-knob"></span></button></div>
        <button id="native-save" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nest-paw"/></svg>保存并收起</button>
      </form>
    </section>
  </div>
  <div class="nest-foot"><span id="native-saved" role="status"></span><span class="nest-foot-links"><button id="native-postoffice" type="button">小邮局 <b id="postoffice-unread" hidden></b></button><button id="native-classic" type="button">经典小獭</button></span></div>
</section>
<svg class="nest-symbols" width="0" height="0" aria-hidden="true"><defs><symbol id="nest-paw" viewBox="0 0 24 24"><path d="M12 12c-3 0-7 4-6 7 1 2 4 1 6 1s5 1 6-1c1-3-3-7-6-7Z"/><ellipse cx="4.5" cy="10" rx="2" ry="2.8" transform="rotate(-25 4.5 10)"/><ellipse cx="9" cy="5.5" rx="2" ry="2.8"/><ellipse cx="15" cy="5.5" rx="2" ry="2.8"/><ellipse cx="19.5" cy="10" rx="2" ry="2.8" transform="rotate(25 19.5 10)"/></symbol></defs></svg>
</body></html>
