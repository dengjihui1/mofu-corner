<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>绒角 · 小邮局</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/postoffice.css"><link rel="stylesheet" href="/postoffice-home.css"><link rel="stylesheet" href="/home-cozy.css"><link rel="stylesheet" href="/home-editor.css"><link rel="stylesheet" href="/friend-invite.css"><link rel="stylesheet" href="/studio-base.css"><link rel="stylesheet" href="/studio-social.css"><link rel="stylesheet" href="/studio-home.css"><script type="module" src="/postoffice.mjs"></script></head><body>
<header class="post-header"><a class="brand" href="/" aria-label="绒角小邮局"><span class="social-mark" aria-hidden="true">mofu.</span><h1>绒角 <small>小邮局</small></h1></a><span id="connection" class="connection" hidden>连接中</span></header>
<main id="auth-main" class="auth-main">
 <div class="auth-art"><div id="postman-art" class="postman-art"></div><p class="auth-hello">你的伙伴，<br>你的空间。</p></div>
 <section class="auth-panel"><p id="friend-invite-auth" class="friend-invite-auth" role="status" hidden></p><div id="auth-tabs" class="auth-tabs"><button type="button" data-auth="login" aria-selected="true">登录</button><button type="button" data-auth="register" aria-selected="false">注册</button></div><h2 id="auth-title">欢迎回来</h2>
 <form id="auth-form"><div data-field="name" hidden><label for="auth-name">你的昵称</label><input id="auth-name" name="name" maxlength="20" autocomplete="nickname"></div><div data-field="handle" hidden><label for="auth-handle">绒角号</label><input id="auth-handle" name="handle" maxlength="24" autocomplete="username" placeholder="例如 lin" aria-describedby="handle-help"><small id="handle-help">3–24 位字母、数字或下划线，以字母开头。</small></div>
 <div data-field="recovery" hidden><label for="auth-recovery">恢复码</label><input id="auth-recovery" name="recovery" maxlength="48" autocomplete="off" spellcheck="false"></div>
 <div data-field="password"><label for="auth-password">密码</label><input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-help"><small id="password-help" hidden>10–128 个字符。</small></div>
 <fieldset id="registration-pets" hidden><legend>选择账号伙伴</legend><div id="registration-pet-list"></div><p id="registration-pet-choice">每个账号一位伙伴，注册后不能更换。</p></fieldset>
 <label id="auth-agreement" class="check-label" hidden><input type="checkbox" id="auth-accepted">我已阅读并同意<a href="/terms" target="_blank" rel="noopener">服务条款</a>与<a href="/privacy" target="_blank" rel="noopener">隐私说明</a></label>
 <p id="auth-message" role="status" class="form-message" hidden></p><button class="primary" id="auth-submit" type="submit">登录</button></form>
 <a class="auth-showcase" href="/showroom.html">浏览空间灵感 →</a><div class="auth-help"><button data-auth="recover" type="button">找回密码</button><button data-auth="login" type="button" id="back-login" hidden>返回登录</button></div></section>
</main>
<main id="postoffice" class="postoffice" hidden>
 <aside class="people-pane"><button id="me-button" class="me-button" type="button" aria-label="我的资料与设置"><span id="me-avatar"></span><span><b id="me-name"></b><small id="me-handle"></small></span><span data-icon="settings"></span></button>
 <nav class="people-tabs" aria-label="邮局"><button data-view="friends" class="active" type="button">信箱 <span id="unread-count"></span></button><button data-view="requests" type="button">申请 <span id="request-count"></span></button><button data-view="search" type="button" aria-label="找朋友"><span data-icon="plus"></span></button></nav>
 <section id="find-friend" hidden><section id="friend-invite" class="friend-invite" aria-live="polite" hidden><button id="friend-invite-dismiss" class="icon-button" type="button" aria-label="收起邀请">×</button><h3 id="friend-invite-title"></h3><p id="friend-invite-note"></p><button id="friend-invite-retry" class="friend-home-link" type="button" hidden>再试一次</button></section><form id="search-form" class="search-form"><label class="sr-only" for="friend-search">好友的绒角号</label><input id="friend-search" placeholder="输入完整绒角号" maxlength="25" autocomplete="off"><button aria-label="搜索" type="submit" data-icon="search"></button></form><p class="search-caption">输入朋友的完整绒角号，或请 TA 发来邀请。</p></section>
 <div id="people-list" class="people-list" aria-live="polite"></div><p id="people-error" class="form-message" role="status" hidden></p>
 <button id="invite-friend" class="invite-friend" data-copy-invite type="button"><span data-icon="mail"></span>邀请朋友</button><div class="people-foot"><button id="logout" type="button">退出登录</button><a href="/privacy" target="_blank" rel="noopener">隐私</a></div></aside>
 <section class="letter-pane"><div id="empty-chat" class="empty-chat"><div id="empty-art"></div><h2>和朋友保持联系</h2><p>聊聊天，或去朋友家看看。</p><div class="empty-friend-actions"><button class="primary" data-copy-invite type="button">复制我的邀请</button><button class="soft-button" data-open-home type="button">布置我的家</button></div><button class="friend-home-link" id="empty-find" type="button">用绒角号找朋友</button></div>
 <div id="conversation" class="conversation" hidden><header class="chat-header"><button id="back-list" class="icon-button" type="button" aria-label="返回信箱" data-icon="back"></button><span id="peer-avatar"></span><div class="peer-title"><h2 id="peer-name"></h2><span id="peer-status"></span></div><button id="relationship-open" class="relationship-open" type="button" hidden>绑定关系</button><button id="chat-more" class="icon-button" type="button" aria-label="好友操作" aria-expanded="false" data-icon="more"></button><div id="chat-menu" class="chat-menu" hidden><button id="visit-peer-home" type="button">去 TA 家坐坐</button><button id="report-peer" type="button">举报</button><button id="block-peer" type="button">屏蔽此人</button><button id="remove-peer" type="button">删除好友</button></div></header>
 <div class="chat-scroll" id="chat-scroll"><button id="load-older" class="load-older" type="button" hidden>查看更早的消息</button><div id="messages" role="log" aria-live="polite" aria-label="聊天记录"></div><p id="history-empty" class="history-empty" hidden>发条消息，开始聊天。</p></div><button id="new-mail" class="new-mail" type="button" hidden>新消息 ↓</button>
 <form id="composer" class="composer"><div class="gesture-actions"><button type="button" data-gesture="heart"><span data-icon="heart"></span>送心</button><button type="button" data-gesture="pat"><span data-icon="paw"></span>摸头</button></div><label class="sr-only" for="message-text">写给好友的信</label><textarea id="message-text" maxlength="1000" rows="2" placeholder="写点什么…"></textarea><div class="composer-foot"><p id="chat-error" class="form-message" role="status" hidden></p><span id="message-count" hidden></span><button id="send-message" class="primary" disabled type="submit">发送 <span data-icon="send"></span></button></div></form>
 </div></section>
</main>
<dialog id="profile-dialog" class="post-dialog"><form id="profile-form"><header><h2>个人资料</h2><button class="icon-button" type="button" data-close="profile-dialog" aria-label="关闭" data-icon="close"></button></header><p id="profile-handle" class="profile-handle"></p><label for="profile-name">昵称</label><input id="profile-name" maxlength="20" required><label>账号伙伴 · 生肖固定</label><div id="profile-pets" class="profile-pets" role="group" aria-label="已绑定生肖"></div><label class="check-label"><input id="profile-discoverable" type="checkbox">允许别人通过绒角号找到我</label><p id="profile-error" role="status" class="form-message" hidden></p><button type="submit" class="primary">保存资料</button></form><details><summary>账号与隐私</summary><div id="blocked-users"></div><button id="export-data" type="button" class="text-button">下载我的数据</button><button id="delete-account" type="button" class="danger text-button">注销账号</button></details></dialog>
<dialog id="relationship-dialog" class="post-dialog relationship-dialog" aria-labelledby="relationship-title">
 <header><h2 id="relationship-title">我们的关系</h2><button type="button" class="icon-button" data-close="relationship-dialog" aria-label="关闭" data-icon="close"></button></header>
 <div class="relationship-keepsake"><div id="relationship-pair" class="relationship-pair"></div><h3 id="relationship-status"></h3><p id="relationship-note"></p><small id="relationship-existing" hidden></small></div>
 <div id="relationship-choices" class="relationship-choices" role="group" aria-label="选择关系"></div>
 <div id="relationship-roles" class="relationship-roles" hidden><span>我是</span><div id="relationship-role-options" role="group" aria-label="你在关系中的身份"></div></div>
 <p id="relationship-error" role="status" class="form-message" hidden></p>
 <div class="relationship-actions"><button id="relationship-submit" class="primary" type="button">发起绑定</button><button id="relationship-decline" class="soft-button" type="button" hidden>暂不接受</button><button id="relationship-accept" class="primary" type="button" hidden>确认绑定</button><button id="relationship-cancel" class="soft-button" type="button" hidden>撤回邀请</button></div>
 <button id="relationship-remove" class="text-button danger relationship-remove" type="button" hidden>解除绑定</button>
</dialog>
<dialog id="confirm-dialog" class="post-dialog compact-dialog"><form id="confirm-form"><header><h2 id="confirm-title"></h2><button type="button" class="icon-button" data-close="confirm-dialog" aria-label="关闭" data-icon="close"></button></header><p id="confirm-copy"></p><label id="confirm-password-label" hidden>登录密码<input id="confirm-password" type="password" autocomplete="current-password"></label><p id="confirm-error" role="status" class="form-message" hidden></p><div class="dialog-actions"><button type="button" data-close="confirm-dialog" class="soft-button">再想想</button><button id="confirm-submit" type="submit" class="primary">确认</button></div></form></dialog>
<dialog id="report-dialog" class="post-dialog compact-dialog"><form id="report-form"><header><h2>告诉小邮局</h2><button type="button" class="icon-button" data-close="report-dialog" aria-label="关闭" data-icon="close"></button></header><blockquote id="report-quote"></blockquote><label for="report-reason">发生了什么</label><textarea id="report-reason" maxlength="500" rows="4" required placeholder="骚扰、诈骗或其他问题"></textarea><label class="check-label"><input id="report-block" type="checkbox" checked>同时屏蔽这位用户</label><p id="report-error" role="status" class="form-message" hidden></p><button type="submit" class="primary">提交举报</button></form></dialog>
<dialog id="recovery-dialog" class="post-dialog compact-dialog" aria-labelledby="recovery-title"><h2 id="recovery-title">保存恢复码</h2><p class="recovery-description">忘记密码时，用它找回账号。恢复码仅这次显示，使用后会换新。</p><code id="recovery-value"></code><button id="copy-recovery" class="soft-button" type="button">复制恢复码</button><label class="check-label"><input id="recovery-saved" type="checkbox">我已安全保存</label><button id="recovery-done" class="primary" type="button" disabled>已保存</button></dialog>
<dialog id="invite-share-dialog" class="post-dialog compact-dialog" aria-labelledby="invite-share-title"><header><h2 id="invite-share-title">请朋友来坐坐</h2><button class="icon-button" type="button" data-close="invite-share-dialog" aria-label="关闭" data-icon="close"></button></header><p id="invite-share-note"></p><label class="sr-only" for="invite-share-link">我的邀请链接</label><input id="invite-share-link" readonly spellcheck="false"><button class="primary" id="invite-share-copy" type="button">复制邀请</button><button class="primary" id="invite-share-privacy" type="button" hidden>去设置被搜索</button></dialog>
<p id="toast" class="toast" role="status" hidden></p>
</body></html>
